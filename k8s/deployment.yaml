apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: iris-api}
  template:
    metadata:
      labels: {app: iris-api}
    spec:
      containers:
        - name: api
          image: iris-api:v1
          imagePullPolicy: IfNotPresent   # image is loaded into kind, never pulled
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          # Under heavy load (hey -c 50) a single pod answers /healthz slowly;
          # generous timeouts keep the liveness probe from killing a busy pod.
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: iris-api
spec:
  selector: {app: iris-api}
  ports: [{port: 80, targetPort: 8080}]
